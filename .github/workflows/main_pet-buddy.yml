
# Build and deploy Pet Buddy backend to Azure

name: Build and deploy Node.js app to Azure Web App - Pet-Buddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install

      - name: Upload backend files
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Backend/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend files
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D5F5F913ECBB4F0FB626A0D07DB5842C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_48518BA494734D0EBD2C636B3ED761B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B37E028ECE1B48F2BDDB974DA7E1B9BD }}

      - name: Deploy backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: Pet-Buddy
          slot-name: Production
          package: .
